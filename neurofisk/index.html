    <meta

      content="NeuroFisk: app que estima el riesgo de una posible crisis epiléptica a partir de señales en vivo y te recomienda cómo actuar."
    />
    <meta name="theme-color" content="#f2f2f7" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("nr-tema");
          var oscuro =
            t === "oscuro" ||
            ((!t || t === "sistema") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var resuelto = oscuro ? "oscuro" : "claro";
          var raiz = document.documentElement;
          raiz.dataset.theme = resuelto;
          raiz.style.colorScheme = oscuro ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", oscuro ? "#000000" : "#f2f2f7");
        } catch (e) {}
      })();
    </script>
